name: Test and package
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -r requirements.txt pytest
      - run: python -m compileall -q app
      - run: docker build -t hopefli-hello:test .
  package:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build release archive
        run: |
          VERSION=$(cat VERSION)
          mkdir -p dist
          tar --exclude=.git --exclude=dist -czf "dist/hopefli-hello-v${VERSION}.tar.gz" .
      - uses: actions/upload-artifact@v4
        with:
          name: hopefli-hello-release
          path: dist/*.tar.gz
