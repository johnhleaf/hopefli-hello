{% extends "base.html" %}{% block content %}<section class="page-head"><p class="eyebrow">ADMIN · PERSONALHANDBOK</p><h1>Redigera artikel</h1></section><section class="panel narrow-panel"><form method="post" class="form"><input type="hidden" name="csrf" value="{{csrf}}"><label>Rubrik<input name="title" value="{{article.title}}" required></label><label>Kategori<select name="category_id"><option value="0">Ingen kategori</option>{% for c in categories %}<option value="{{c.id}}" {% if c.id == article.category_id %}selected{% endif %}>{{c.name}}</option>{% endfor %}</select></label><label>Text<textarea name="body" rows="16" required>{{article.body}}</textarea></label><label>Ordning<input type="number" name="sort_order" value="{{article.sort_order}}"></label><label class="check"><input type="checkbox" name="published" {% if article.published %}checked{% endif %}> Publicerad</label><button class="primary">Spara ändringar</button><button class="secondary danger" name="delete" value="1" onclick="return confirm('Ta bort artikeln?')">Ta bort artikel</button></form></section>{% endblock %}
